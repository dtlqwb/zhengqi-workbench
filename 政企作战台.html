    const dup={};
    TS().filter(t=>t.status!=='已完成').forEach(t=>{
      const k=t.personId+'|'+String(t.title||'').trim();
      (dup[k]=dup[k]||[]).push(t);
    });
    const dups=[].concat.apply([],Object.keys(dup).filter(k=>dup[k].length>1).map(k=>dup[k].slice(1)));
    add('任务','amber','同一人下有重复任务（标题一样且都没完成）',dups.map(t=>tk(t,'重复：'+t.title.slice(0,12))));

    /* 业务 */
    const noCli=PS().filter(p=>!p.clientId||!CS().some(c=>c.id===p.clientId));
    add('业务','amber','没标委托方（或原客户已删）',noCli.map(p=>bk(p)));

    const el=document.activeElement;
    if(!el||!el.dataset||!el.dataset.act)return;
    if(NATIVE.test(el.tagName)||el.isContentEditable)return;
    if(el.getAttribute('aria-disabled')==='true')return;
    e.preventDefault();
    el.click();
  },true);

  /* 弹层焦点锁定：打开时把焦点送进去，Tab 到边界就回绕，关掉把焦点还回去 */
  let lastFocus=null,lastModal=null;
  function trap(){
    const m=document.querySelector('#modalRoot .modal');
    if(!m){
      if(lastModal&&lastFocus&&document.contains(lastFocus)){try{lastFocus.focus()}catch(e){}}
      lastModal=null;lastFocus=null;return;
    }
    if(m===lastModal)return;
    lastFocus=document.activeElement;
    lastModal=m;
    const pool=[...m.querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled);
    /* 优先落在第一个输入框；没有输入框就落在主按钮，别一进来就停在关闭的 × 上 */
    const fields=[...m.querySelectorAll('input,select,textarea')].filter(x=>!x.disabled&&x.offsetParent!==null);
    const target=fields[0]||m.querySelector('.mf .btn.pri')||m.querySelector('.mf .btn')||pool[0];
    if(target)try{target.focus()}catch(e){}
    m.addEventListener('keydown',ev=>{
      if(ev.key!=='Tab')return;
      const pool=[...m.querySelectorAll('button,input,select,textarea,[tabindex="0"]')]
        .filter(x=>!x.disabled&&x.offsetParent!==null);
      if(!pool.length)return;
      const i=pool.indexOf(document.activeElement);
      if(ev.shiftKey&&i<=0){ev.preventDefault();pool[pool.length-1].focus()}
      else if(!ev.shiftKey&&i===pool.length-1){ev.preventDefault();pool[0].focus()}
    });
  }

  const _r=render;render=function(){_r();try{decorate();trap()}catch(e){}};
  const mr=document.getElementById('modalRoot');
  if(mr)new MutationObserver(()=>{try{decorate();trap()}catch(e){}}).observe(mr,{childList:true});
  const dr=document.getElementById('drawerRoot');
  if(dr)new MutationObserver(()=>{try{decorate()}catch(e){}}).observe(dr,{childList:true});

  window.__R19__={decorate,trap,LBL};
})();
/* ===== R20（2026-11-08）：第一次打开别是一片空白 —— 三步引导 + 带客户的演示数据 ===== */
(function(){
  const st=document.createElement('style');
  st.textContent=`
  .r20{margin-bottom:14px;padding:16px 18px;border:1px dashed var(--line);border-radius:12px;background:var(--panel)}
  .r20 h3{margin:0 0 4px;font-size:15px}
  .r20 .lead{font-size:12.5px;color:var(--muted);line-height:1.8;margin-bottom:12px}
  .r20 .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .r20 .s{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
  .r20 .s b{display:block;font-size:12.5px;margin-bottom:2px}
  .r20 .s i{font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.7;display:block;margin-bottom:7px}
  .r20 .s .n{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:9px;background:var(--brand);
    color:#fff;font-size:10.5px;text-align:center;margin-right:5px}
  .r20 .alt{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  @media(max-width:620px){.r20 .steps{grid-template-columns:1fr}}
  body.dark .r20 .s{background:#1b242b}`;
  document.head.appendChild(st);

  const CLI=[
    ['市政公用局','政府部门','财政直付',['智慧水务平台','管网漏损治理改造']],
    ['交通运输局','政府部门','财政直付',['治超不停车检测']],
    ['工业和信息化局','政府部门','财政直付',['5G政务外网','电子围栏']],
    ['教育局','政府部门','财政直付',['校园监控运维']],
    ['市场监督管理局','政府部门','财政直付',['明厨亮灶']],
    ['乡村振兴公司','国企','按合同分期',['云视讯专线','网格运营','农业综合改革平台','AI广播运维']],
    ['宜发同诚农业','企业','按合同分期',['校园餐配送车间监控']],
    ['农业农村局','政府部门','财政直付',['土地测绘','五进五融','综合管理']]
  ];
  const COL=['#0f6b8a','#c0507a','#0f9b96','#7a5cd6','#d98324','#2563d9','#b5651d','#3b6d11'];

  function isEmpty(){
    return !((S.people||[]).length||(S.tasks||[]).length||(S.ext||[]).length||(S.projects||[]).length);
  }

  function loadDemo(){
    const th=S&&S.meta?S.meta.theme:'light';
    const ui=S&&S.ui?S.ui:{view:'room',f:{}};
    const d=demo();
    d.meta.theme=th;d.ui=ui;
    /* 演示数据原来没有委托方，客户视图会是空的。这里按业务把单位配上，整套才是通的 */
    d.ext=CLI.map((c,i)=>({id:'dm'+i,name:c[0],type:c[1],pay:c[2],contact:'',title:'',phone:'',duty:'',color:COL[i%COL.length]}));
    const byProj={};
    CLI.forEach((c,i)=>c[3].forEach(p=>{byProj[p]='dm'+i}));
    const byName={};
    (d.tasks||[]).forEach(t=>{
      const nm=String(t.project||'').trim();if(!nm||byName[nm])return;
      byName[nm]={id:'dp'+Object.keys(byName).length,name:nm,clientId:byProj[nm]||'',created:TODAY};
    });
    d.projects=Object.keys(byName).map(k=>byName[k]);
    (d.tasks||[]).forEach(t=>{
      const p=byName[String(t.project||'').trim()];
      if(p){t.projectId=p.id;if(!t.client)t.client=p.clientId}
    });
    /* 演示数据得像个能干活的样板：目标、段位、里程碑都补上，否则看板全是「还差…」 */
    const STG={'智慧水务平台':'S2','管网漏损治理改造':'S2','治超不停车检测':'S5','云视讯专线':'S3','AI广播运维':'S3'};
    (d.projects||[]).forEach(p=>{
      p.kind=p.kind||'once';
      p.goal=p.goal||('按期交付「'+p.name+'」并完成回款');
      p.why=p.why||'年度重点，已列入委托方工作计划';
      p.decision=p.decision||'接';
      const g=STG[p.name]||'S1';
      p.stage=g;
      if(g==='S2'||g==='S3'){
        p.milestones=[{name:'方案与报价定稿',due:shift(10),done:g==='S3'},{name:'进场实施',due:shift(25),done:false}];
        p.planOk=true;p.deliverTarget=1;
      }
      if(g==='S5'){
        p.planOk=true;p.deliverTarget=1;p.closedAt=shift(-12);
        p.review={did:'按期交付并通过验收',gap:'备件到货慢，中途停了三天',why:'采购周期没算进计划',next:'提前一个月备货'};
      }
    });
    S=d;save();render();
    toast('演示数据已装入：'+d.ext.length+' 家委托方 · '+d.projects.length+' 个业务 · '+(d.tasks||[]).length+' 条任务');
  }

  function card(){
    return `<div class="r20">
      <h3>还没有数据 —— 三步就能跑起来</h3>
      <div class="lead">这套东西的顺序是「先有委托方，再有业务，最后才是任务」。跳过前两步直接派活，业务五段会是空的。</div>
      <div class="steps">
        <div class="s"><b><span class="n">1</span>添加委托方</b><i>谁给的活。写单位全称，关键人以后慢慢补。</i>
          <button class="btn sm pri" data-act="newext">＋ 添加客户</button></div>
        <div class="s"><b><span class="n">2</span>建业务</b><i>该不该干、目标是什么、委托方是谁。这一步不能省。</i>
          <button class="btn sm" data-act="biznew">＋ 新建业务</button></div>
        <div class="s"><b><span class="n">3</span>派任务</b><i>谁去干、什么时候交。任务必须挂在一个业务上。</i>
          <button class="btn sm" data-act="newtask">＋ 派单</button></div>
      </div>
      <div class="alt"><span>想先看看长什么样：</span>
        <button class="btn sm" data-act="r20demo">装入演示数据</button>
        <span>装完可以直接在这上面改；不想要了在「数据与备份」里一键清空。</span></div>
    </div>`;
  }

  function patch(){
    const view=document.getElementById('view');if(!view)return;
    const old=view.querySelector('.r20');
    if(!isEmpty()){if(old)old.remove();return}
    if(old)return;
    const box=document.createElement('div');
    box.innerHTML=card();
    const el=box.firstElementChild;
    const hd=view.querySelector('.view-head');
    if(hd)hd.insertAdjacentElement('afterend',el);else view.insertBefore(el,view.firstChild);
  }

  const _r=render;render=function(){_r();try{patch()}catch(e){}};

  document.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest('[data-act="r20demo"]');if(!el)return;
    e.preventDefault();e.stopPropagation();
    if(!isEmpty()&&!confirm('当前已有数据，装入演示数据会覆盖掉。确定继续？'))return;
    loadDemo();
  },true);

  window.__R20__={isEmpty,loadDemo,card,CLI};
})();
load();initAuto();
</script>
