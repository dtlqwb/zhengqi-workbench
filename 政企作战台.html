<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>政企作战台 · 团队派单与协调</title>
<style>
:root{
  --bg:#f3f5f9; --panel:#fff; --panel2:#fafbfd; --ink:#1b2432; --ink2:#48566a;
  --muted:#8894a6; --line:#e4e9f1; --brand:#2563d9; --brand-soft:#eaf1ff;
  --nav1:#101d33; --nav2:#173a6b;
  --s0:#8b95a5; --s1:#2563d9; --s2:#d9870b; --s3:#12a06a; --danger:#dc3f3f;
  --r1:#2563d9; --r2:#0f9b96; --r3:#7a5cd6; --r4:#d98324; --r5:#c0507a;
  --shadow:0 2px 10px rgba(24,44,80,.06); --shadow2:0 12px 40px rgba(16,29,51,.18);
}
body.dark{
  --bg:#0e1521; --panel:#151f2e; --panel2:#1b2738; --ink:#e8eef8; --ink2:#b3c0d2;
  --muted:#7f8ea3; --line:#26344a; --brand:#5b91ff; --brand-soft:#1d2c48;
  --nav1:#0b1220; --nav2:#152b4d; --shadow:0 2px 10px rgba(0,0,0,.25);
  --shadow2:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c9d2e0;border-radius:8px}
body.dark ::-webkit-scrollbar-thumb{background:#35455e}
.topbar{background:linear-gradient(110deg,var(--nav1),var(--nav2));color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(10,24,48,.22)}
.topbar-in{max-width:1660px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:205px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4b8bff,#28c6b4);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.brand h1{font-size:17px;margin:0;letter-spacing:.5px}.brand p{margin:0;font-size:11px;opacity:.62}
.datebox{display:flex;align-items:baseline;gap:9px;padding-left:18px;border-left:1px solid rgba(255,255,255,.16)}
.datebox .d1{font-size:20px;font-weight:700}.datebox .d2{font-size:12px;opacity:.7}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;transition:.15s;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.2)}.tbtn.primary{background:#3c7dff;border-color:#3c7dff;font-weight:600}.tbtn.primary:hover{background:#5590ff}
.tbtn.ghost{background:transparent}
.sync-tip{font-size:11.5px;color:#a9e6c8;background:rgba(40,190,130,.14);border:1px solid rgba(40,190,130,.35);border-radius:7px;padding:5px 10px;white-space:nowrap}
.sync-tip.off{color:#ffd88a;background:rgba(255,196,80,.12);border-color:rgba(255,196,80,.35)}
.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:35}
.tabs-in{max-width:1660px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto}
.tab{border:none;background:none;padding:12px 16px;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.tab .cnt{display:inline-block;margin-left:6px;background:var(--brand-soft);color:var(--brand);border-radius:9px;padding:0 6px;font-size:11px}
.wrap{max-width:1660px;margin:0 auto;padding:18px 22px 60px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 0 14px;flex-wrap:wrap}
.view-head h2{margin:0;font-size:19px}.view-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--brand))}
.kpi .lb{font-size:12px;color:var(--muted)}.kpi .num{font-size:26px;font-weight:750;letter-spacing:-1px;margin-top:2px;line-height:1.15}.kpi .foot{font-size:11px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-h h3{margin:0;font-size:14px}.panel-h .hint{font-size:11.5px;color:var(--muted)}.panel-b{padding:13px 16px}
.rolegroup{margin-bottom:18px}.rolegroup:last-child{margin-bottom:0}
.role-h{display:flex;align-items:center;gap:9px;margin:0 0 9px;font-size:13px;font-weight:700}
.role-dot{width:9px;height:9px;border-radius:3px;background:var(--rc)}
.role-h .n{color:var(--muted);font-weight:500;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px;cursor:pointer;transition:.16s;position:relative;box-shadow:var(--shadow)}
.pcard:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 6px 18px rgba(37,99,217,.13)}
.pc-top{display:flex;align-items:center;gap:9px}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.pc-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-org{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:10.5px;border-radius:5px;padding:2px 7px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.red{background:#fdecec;color:#c62f2f;border-color:#f7d2d2}.chip.blue{background:var(--brand-soft);color:var(--brand);border-color:#cfe0ff}
.chip.green{background:#e7f7f0;color:#0d8458;border-color:#c8ecd9}.chip.orange{background:#fff3e0;color:#b56a00;border-color:#f6dfb5}
.chip.purple{background:#f1ebff;color:#6a46c9;border-color:#ded0ff}
body.dark .chip.red{background:#402020;color:#ff9b9b;border-color:#5a2c2c}body.dark .chip.blue{background:#1d2c48;color:#8fb4ff;border-color:#2c4470}
body.dark .chip.green{background:#16362a;color:#79ddb0;border-color:#245440}body.dark .chip.orange{background:#3a2c14;color:#ffc36b;border-color:#5a4220}
body.dark .chip.purple{background:#2a2140;color:#c3a8ff;border-color:#42336a}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:9px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#37c2a8);border-radius:5px}
.badge-alert{position:absolute;top:8px;right:8px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.list{display:flex;flex-direction:column}
.li{padding:9px 2px;border-bottom:1px dashed var(--line);display:flex;gap:9px;align-items:flex-start}.li:last-child{border-bottom:none}.li:first-child{padding-top:2px}
.li .body{flex:1;min-width:0}.li .t{font-size:12.5px;font-weight:600;line-height:1.45;cursor:pointer}.li .t:hover{color:var(--brand)}
.li .m{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap}.li .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;flex:none;font-weight:700}
.dotline{position:relative;padding-left:15px}.dotline::before{content:"";position:absolute;left:3px;top:5px;bottom:5px;width:1px;background:var(--line)}
.fb{padding:8px 0 8px 14px;position:relative;border-bottom:1px dashed var(--line)}.fb:last-child{border-bottom:none}
.fb::before{content:"";position:absolute;left:0;top:14px;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.fb .f1{font-size:12px;line-height:1.5}.fb .f2{font-size:10.5px;color:var(--muted);margin-top:3px}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:20px 10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.filters select,.filters input,.fld{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;outline:none;min-height:34px}
.filters select:focus,.filters input:focus,.fld:focus{border-color:var(--brand)}.filters input[type=search]{min-width:180px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}.btn.pri:hover{filter:brightness(1.1);color:#fff}
.btn.dgr{color:var(--danger);border-color:#f0c9c9}.btn.sm{padding:4px 9px;font-size:11.5px}.btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(215px,1fr));gap:11px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;min-height:170px}.kcol.over{outline:2px dashed var(--brand);background:var(--brand-soft)}
.kh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 3px}.kh .n{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.kh .n i{width:8px;height:8px;border-radius:3px;display:inline-block}.kh .c{font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.tcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--pc,var(--s0));border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow);transition:.15s}
.tcard:hover{border-color:var(--brand);box-shadow:0 5px 16px rgba(37,99,217,.13)}.tcard.dragging{opacity:.45}
.tcard .tt{font-size:12.5px;font-weight:600;line-height:1.5}.tcard .who{font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:5px;margin-top:7px}
.tcard .tm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.mini-av{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:700;flex:none}
.pill{font-size:10px;border-radius:4px;padding:1px 6px;font-weight:600;white-space:nowrap}
.pill.p0{background:#fdecec;color:#c62f2f}.pill.p1{background:#fff3e0;color:#b56a00}.pill.p2{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
body.dark .pill.p0{background:#402020;color:#ff9b9b}body.dark .pill.p1{background:#3a2c14;color:#ffc36b}
.due{font-size:10.5px;color:var(--muted)}.due.late{color:var(--danger);font-weight:700}.due.today{color:var(--s2);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:none}tbody tr:hover{background:var(--panel2)}
.tname{font-weight:600;cursor:pointer}.tname:hover{color:var(--brand)}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px}
.proj{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.proj:hover{border-color:var(--brand);transform:translateY(-2px)}.proj h4{margin:0 0 3px;font-size:14px}.proj .ps{font-size:11.5px;color:var(--muted)}
.proj .pn{display:flex;gap:14px;margin:10px 0 7px}.proj .pn b{font-size:19px;display:block;line-height:1.2}.proj .pn span{font-size:10.5px;color:var(--muted)}
.brief-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 24px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.85;white-space:pre-wrap;min-height:430px}
.brief:focus{outline:none;border-color:var(--brand)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.room-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.room-wrap{position:relative;background:linear-gradient(180deg,#eef3fb,#dce6f5);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
body.dark .room-wrap{background:linear-gradient(180deg,#18263d,#0f1a2b)}
.room-wrap svg{display:block;width:100%;height:auto}
.room-tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow2);min-width:196px;max-width:260px;z-index:6;opacity:0;transition:opacity .12s;font-size:12px}
.room-tip.show{opacity:1}.room-tip .n{font-weight:700;font-size:13.5px}.room-tip .r{color:var(--muted);font-size:11px;margin-bottom:5px}
.room-tip .row{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:11.5px}.room-tip .hintx{color:var(--muted);font-size:10.5px;margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
.actor{cursor:pointer}.actor .head{transition:transform .2s}.actor .body{animation:breathe 3.4s ease-in-out infinite;transform-origin:center bottom}
.actor:hover .head{transform:translateY(-3px) rotate(-4deg)}
.actor .arm-down{transition:opacity .18s}.actor .arm-up{opacity:0;transition:opacity .18s}
.actor:hover .arm-down{opacity:0}.actor:hover .arm-up{opacity:1}
.actor.sel .arm-down,.actor.good .arm-down{opacity:0}.actor.sel .arm-up,.actor.good .arm-up{opacity:1}
.actor.late .head{animation:shake .75s ease-in-out infinite}
.actor .halo{opacity:0;transition:opacity .2s}.actor:hover .halo,.actor.sel .halo{opacity:1}
.actor.sel .selring{opacity:1}.selring{opacity:0;transition:opacity .2s}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.975)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
.blink{animation:blink 4.5s infinite;transform-origin:center}
.org-card{cursor:pointer;transition:.15s}.org-card:hover{filter:brightness(1.09)}.pulse{animation:pulse 1.5s ease-in-out infinite}
.pick-bar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow2);display:flex;gap:8px;align-items:center;z-index:7;font-size:12.5px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}

.org-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.orgbox{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;box-shadow:var(--shadow);border-top:3px solid var(--oc)}
.orgbox h4{margin:0 0 2px;font-size:14px}.orgbox .duty{font-size:11.5px;color:var(--muted);min-height:32px}
.orgbox .stat{display:flex;gap:16px;margin:10px 0}.orgbox .stat b{font-size:20px;display:block;line-height:1.2}.orgbox .stat span{font-size:10.5px;color:var(--muted)}
.blk{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--s2);border-radius:7px;padding:8px 10px;margin-bottom:7px;font-size:12px}
.blk.hot{border-left-color:var(--danger)}.blk .bt{font-weight:600;line-height:1.45;cursor:pointer}.blk .bt:hover{color:var(--brand)}
.blk .bm{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.steps{display:flex;align-items:stretch;overflow-x:auto;margin-bottom:16px}
.step{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);padding:11px 13px}
.step:first-child{border-radius:10px 0 0 10px}.step:last-child{border-radius:0 10px 10px 0}

.step .sc{font-size:18px;font-weight:750;margin-top:4px}.step.on{background:var(--brand-soft);border-color:var(--brand)}

.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .full{grid-column:1/-1}
label.fl{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600}

function dueInfo(d,status){
  if(!d)return{txt:'未设期限',cls:''};

  if(diff===1)return{txt:'明天到期',cls:'today'};

function load(){

  S=demo();save();
}
function stats(){
  const t=S.tasks,n=t.length,done=t.filter(x=>x.status==='已完成').length;
  return {people:S.people.length,orgs:S.orgs.length,total:n,today:t.filter(x=>x.due===TODAY&&x.status!=='已完成').length,
    doing:t.filter(x=>x.status==='进行中').length,check:t.filter(x=>x.status==='待验收').length,
    late:t.filter(isLate).length,blocked:t.filter(isBlocked).length,done,rate:n?Math.round(done/n*100):0};
}
function pstats(id){
  const t=S.tasks.filter(x=>x.personId===id);
  return {total:t.length,done:t.filter(x=>x.status==='已完成').length,late:t.filter(isLate).length,
    doing:t.filter(x=>x.status==='进行中').length,blocked:t.filter(isBlocked).length,
    rate:t.length?Math.round(t.filter(x=>x.status==='已完成').length/t.length*100):0};
}
function ostat(id){
  const t=S.tasks.filter(x=>(x.support||[]).includes(id)&&x.status!=='已完成');
  return {total:t.length,blocked:t.filter(x=>x.flow===org(id).short).length,tasks:t};
}

/* 文件同步 */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('zqbench',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const db=await idbOpen();return new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()})}catch(e){}}
async function idbGet(k){try{const db=await idbOpen();return new Promise(res=>{const t=db.transaction('kv','readonly');const q=t.objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function syncFile(){
  if(!fileHandle)return;
  try{
    if(await fileHandle.queryPermission({mode:'readwrite'})!=='granted'){
      if(await fileHandle.requestPermission({mode:'readwrite'})!=='granted')return;
    }
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(Object.assign({exportedAt:new Date().toISOString(),dataDate:TODAY},S),null,2));
    await w.close();
    const tip=document.getElementById('syncTip');if(tip){tip.textContent='已自动同步数据文件';tip.classList.remove('off')}
  }catch(e){}
}
async function bindFile(){
  if(!window.showSaveFilePicker){toast('当前浏览器不支持自动写文件，请用「导出数据快照」');return}
  try{
    fileHandle=await window.showSaveFilePicker({suggestedName:'政企作战台_数据.json',types:[{description:'JSON 数据文件',accept:{'application/json':['.json']}}]});
    await idbSet('fh',fileHandle);await syncFile();toast('绑定成功，之后每次改动会自动写入该文件');
  }catch(e){if(e.name!=='AbortError')toast('绑定失败：'+e.message)}
}
function download(name,content,type){
  const b=new Blob([content],{type:type||'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function exportSnapshot(){download('政企作战台_数据.json',JSON.stringify(Object.assign({exportedAt:new Date().toISOString(),dataDate:TODAY},S),null,2),'application/json');toast('快照已导出，请放到：'+SYNC_PATH)}

    return `<button class="tab ${S.ui.view===k?'on':''}" data-act="view" data-v="${k}">${v}${c}</button>`;
  }).join('');
  const f={room:vRoom,today:vToday,board:vBoard,flow:vFlow,people:vPeople,project:vProject,brief:vBrief}[S.ui.view]||vRoom;

function briefText(){
  const s=stats(),late=S.tasks.filter(isLate).sort((a,b)=>a.due.localeCompare(b.due));
  const today=S.tasks.filter(t=>t.due===TODAY&&t.status!=='已完成');
  const doing=S.tasks.filter(t=>t.status==='进行中'),check=S.tasks.filter(t=>t.status==='待验收');
  const tomorrow=S.tasks.filter(t=>t.due===shift(1)&&t.status!=='已完成');
  const fbs=S.tasks.filter(t=>t.feedback).slice(-5);
  const L=[`【政企团队日报】${TODAY} ${WEEK[new Date().getDay()]}`,''];
  L.push(`一、总览：直管 ${s.people} 人、市公司协调 ${s.orgs} 个部门，任务共 ${s.total} 项；已完成 ${s.done} 项（${s.rate}%），进行中 ${s.doing} 项，待验收 ${s.check} 项，逾期 ${s.late} 项，卡在市公司协调 ${s.blocked} 项。`,'');
  L.push(`二、逾期需催（${late.length} 项）`,...(late.length?late.map((t,i)=>`  ${i+1}. ${t.title}｜${person(t.personId).name}｜${dueInfo(t.due,t.status).txt}`):['  无']),'');
  L.push(`三、今日到期（${today.length} 项）`,...(today.length?today.map((t,i)=>`  ${i+1}. ${t.title}｜${person(t.personId).name}｜${t.prio}`):['  无']),'');
  L.push(`四、卡在市公司部门（${s.blocked} 项，按部门归口）`);
  if(s.blocked){S.orgs.forEach(o=>{const g=S.tasks.filter(t=>t.flow===o.short&&t.status!=='已完成');if(!g.length)return;
    L.push(`  【${o.name}】`);g.forEach((t,i)=>L.push(`    ${i+1}. ${t.title}｜${person(t.personId).name}｜已等 ${waitDays(t)} 天${t.flowNote?'｜'+t.flowNote:''}`));});}
  else L.push('  无');
  L.push('');
  L.push(`五、待我验收（${check.length} 项）`,...(check.length?check.map((t,i)=>`  ${i+1}. ${t.title}｜${person(t.personId).name}`):['  无']),'');
  L.push(`六、一线反馈摘录（${fbs.length} 条）`,...(fbs.length?fbs.map((t,i)=>`  ${i+1}. [${person(t.personId).name}] ${t.feedback}`):['  暂无']),'');
  L.push(`七、明日预排（${tomorrow.length} 项）`,...(tomorrow.length?tomorrow.map((t,i)=>`  ${i+1}. ${t.title}｜${person(t.personId).name}`):['  暂无']),'');
  L.push('八、需协调事项',S.meta.briefNote?S.meta.briefNote.split('\n').filter(Boolean).map(x=>'  · '+x).join('\n'):'  无','');
  L.push(`（共 ${doing.length} 项在推进；本简报由政企作战台自动生成，${window.__CLOUD__?'数据已同步云端、仅授权账号可改':'数据仅存本机'}）`);
  return L.join('\n');
}

/* 定时自动简报（页面开着时） */
function checkAutoBrief(){
  if(S.meta.autoBrief===false)return;
  const now=new Date(),cur=now.getHours()*60+now.getMinutes();
  const slots=[[S.meta.morning||'07:00','晨报·待办简报'],[S.meta.evening||'19:00','复盘·进展复盘']];
  for(const [hm,label] of slots){
    const [h,m]=hm.split(':').map(Number),diff=cur-(h*60+m);
    if(diff<0||diff>=30)continue;
    const k=TODAY+'-'+hm;S.meta.lastBriefs=S.meta.lastBriefs||[];
    if(S.meta.lastBriefs.includes(k))continue;
    S.meta.lastBriefs.push(k);save();
    if(S.ui.view!=='brief'){S.ui.view='brief';render()}refreshBrief();
    toast('已自动生成 '+label+'（'+hm+'）');
    try{if(window.Notification&&Notification.permission==='granted')new Notification('政企作战台 · '+label,{body:'简报已按最新数据生成，可一键复制发群'})}catch(x){}
    break;
  }
}

  if(location.hash==='#dump'){document.getElementById('view').innerHTML='<pre id="dumpBox">'+esc(JSON.stringify(S))+'</pre>';return}
  checkAutoBrief();setInterval(checkAutoBrief,60000);render();
}

  function setVer(n){let v=document.getElementById('verTag');if(!v){v=document.createElement('div');v.id='verTag';v.className='ver-tag';document.body.appendChild(v)}v.textContent='政企作战台 V'+n}
  setVer(3);

  const splitLine=x=>String(x).split(/\t|,|，/).map(s=>s.trim());
  function parseDue(v){v=String(v||'').trim();if(!v)return TODAY;
    if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
    if(v==='今天')return TODAY;if(v==='明天')return shift(1);

  window.bulkModal=function(){
    modal('批量粘贴导入（V3）',`<div style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px">从 Excel 复制后直接粘贴，每行一条；支持逗号 / 制表符 / 中文逗号分隔。姓名或任务标题重复的行会跳过。</div>

        <div style="font-size:10.5px;color:var(--muted);margin-top:5px">角色须是：客户经理 / 网格长 / 合伙公司负责人 / 个体技工</div></div>
        <div><label class="fl">② 任务清单：任务, 负责人, 项目, 优先级, 截止</label>

        <div style="font-size:10.5px;color:var(--muted);margin-top:5px">截止可写：今天 / 明天 / +3 / 2026-11-20；优先级：紧急 / 重要 / 常规</div></div></div>
      <div id="bk_result" style="font-size:12px;margin-top:10px;color:var(--brand)"></div>`,
      `<button class="btn" data-act="close">取消</button><button class="btn pri" data-act="dobulk">导入</button>`);
  };
  window.doBulk=function(){
    const pl=(document.getElementById('bk_people').value||'').split(/\r?\n/).filter(x=>x.trim());
    const tl=(document.getElementById('bk_tasks').value||'').split(/\r?\n/).filter(x=>x.trim());
    let np=0,nt=0,skip=0;
    pl.forEach(line=>{const c=splitLine(line);if(!c[0])return;
      if(S.people.some(p=>p.name===c[0])){skip++;return}
      const role=ROLES.includes(c[1])?c[1]:'客户经理';
      S.people.push({id:uid(),name:c[0],role,rel:'直管',org:c[2]||'',phone:c[3]||'',note:'',tags:'',color:ROLEHEX[role]});np++;});
    tl.forEach(line=>{const c=splitLine(line);if(!c[0])return;
      if(S.tasks.some(t=>t.title===c[0])){skip++;return}
      const p=S.people.find(x=>x.name===c[1]);
      S.tasks.unshift({id:uid(),title:c[0],personId:p?p.id:(S.people[0]?S.people[0].id:''),project:c[2]||'综合管理',
        prio:PRIOS.includes(c[3])?c[3]:'常规',due:parseDue(c[4]),status:'待接收',note:'',feedback:'',
        support:[],flow:'',flowNote:'',blockedSince:'',created:TODAY,updated:TODAY,log:[{at:TODAY,text:'批量导入'}]});nt++;});
    save();closeModal();render();toast('导入完成：成员 +'+np+'、任务 +'+nt+(skip?'，跳过重复 '+skip+' 行':''));
  };
  /* 状态变更留痕 + 完成时间 */
  const _save=save,_status={};
  save=function(){
    if(S&&S.tasks)S.tasks.forEach(t=>{
      const prev=_status[t.id];
      if(prev&&prev!==t.status){t.log=t.log||[];t.log.push({at:TODAY,text:'状态：'+prev+' → '+t.status});if(t.status==='已完成')t.doneAt=TODAY;}
      if(prev===undefined&&t.status==='已完成'&&!t.doneAt)t.doneAt=t.updated||TODAY;
      _status[t.id]=t.status;

    return _save();
  };

      (logs.length?`<div class="tl">${logs.map(l=>`<div class="ti">${esc(l.at)} · ${esc(l.text)}</div>`).join('')}</div>`:
      '<div style="font-size:11.5px;color:var(--muted)">暂无变更记录；此后每次改状态会自动留痕</div>')+
      (t.doneAt?`<div style="font-size:11.5px;color:var(--s3);margin-top:7px">完成于 ${esc(t.doneAt)}</div>`:'');
    mb.appendChild(box);};

    const grid=mb.querySelector('div[style*="display:grid"]');if(grid)grid.insertBefore(b,grid.children[1]||null);else mb.appendChild(b);};
  /* 简报加「今日已收口」 */
  const _bt=briefText;
  briefText=function(){const s=_bt(),done=S.tasks.filter(t=>t.doneAt===TODAY);
    const sec='九、今日已收口（'+done.length+' 项）\n'+(done.length?done.map((t,i)=>`  ${i+1}. ${t.title}｜${person(t.personId).name}`).join('\n'):'  暂无')+'\n\n';
    return s.replace('（共 ',sec+'（共 ');};
  document.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
    if(el.dataset.act==='bulk'){closeModal();bulkModal()}

  /* 真正写入：opt 里带项目/优先级/协同部门/主责人；返回新任务（失败返回 null） */
  function wbAdopt(nodeId,opt){
    wbEnsure();
    const it=S.wbInbox.find(x=>x.nodeId===nodeId);if(!it||it.state==='adopted')return null;
    if(it.demo){toast('演示数据不收录，请先忽略');return null}
    const o=opt||{};
    const pid=o.personId!==undefined?o.personId:matchPerson(it.assignee);
    const t={
      id:uid(),title:it.title,personId:pid,project:o.project||'',prio:o.prio||'常规',
      due:o.due||it.due||'',status:STAGE_STATUS[it.stage]||'待接收',

      feedback:'',support:Array.isArray(o.support)?o.support.slice():[],flow:'',flowNote:'',
      src:'wb',wbNode:it.nodeId,wbBoard:it.boardId,
      created:TODAY,updated:TODAY,log:[{at:TODAY,text:'从白板收件箱收录（'+it.stageLabel+'）'}]
    };
    S.tasks.push(t);
    it.state='adopted';it.wbTask=t.id;
    /* 收录时就把当前白板阶段记成基线：之后白板真变了才跟，没变不动 */
    it.lastStage=it.stage;delete it.wbBack;
    /* 手动指定过受理人 → 把这个昵称和成员的对应关系记住，下次同名自动匹配 */
    if(pid&&it.assignee){

        if(!S.nameAlias[key])S.nameAlias[key]=pid;}
    }
    return t;
  }

  function saveTask2(id){

      toast('前置条件还差 '+miss.length+' 项（'+miss.slice(0,2).join('、')+(miss.length>2?' 等':'')+'），不能推进到「'+status+'」');

      note:document.getElementById('f_note').value.trim(),feedback:document.getElementById('f_feedback').value.trim(),updated:TODAY};

  /* ---------- 简报加交付与前置两节 ---------- */
  const _bt10=briefText;
  briefText=function(){
    const s=_bt10();
    const wait=S.tasks.filter(t=>t.status==='已完成'&&!t.receipt&&(t.deliverable||t.client));
    const blocked=S.tasks.filter(t=>gatesOf(t).length&&gateMiss(t).length&&t.status!=='待接收'&&t.status!=='已完成');
    if(!wait.length&&!blocked.length)return s;
    const L=[];
    if(wait.length){L.push('十、已交付待回执（'+wait.length+' 项，催签字 / 催验收）');
      wait.forEach((t,i)=>{const c=t.client?ext(t.client):null;L.push(`  ${i+1}. ${t.title}${c?'｜'+c.name:''}｜${person(t.personId).name}`)});L.push('');}
    if(blocked.length){L.push('十一、前置条件未齐（不能推进）');
      blocked.forEach((t,i)=>{const m=gateMiss(t);L.push(`  ${i+1}. ${t.title}｜${person(t.personId).name}｜差 ${m.length} 项：${m.slice(0,3).join('、')}${m.length>3?' 等':''}`)});L.push('');}

    if(!S||!Array.isArray(S.wbInbox)||!S.wbInbox.length)return false;
    if(S.ui&&S.ui.keepDemo)return false;
    const hasBiz=(S.people||[]).length>0||(S.tasks||[]).length>0||(S.ext||[]).length>0;
    if(!hasBiz)return false;
    if(!S.wbInbox.some(x=>x.demo))return false;
    const n=S.wbInbox.length;
    S.wbInbox=S.wbInbox.filter(x=>!x.demo);
    return S.wbInbox.length!==n;
  }

  /* --- 4) 角色表兜底重算 ---
     云端拉下来的数据会整体替换 S，此时新角色（如「业务管理」）进不了 ROLES，
     作战室图例 / 流程图角色行 / 派单下拉就会漏人。每次渲染前对一遍。 */
  const PAL13=['#2563d9','#0f9b96','#7a5cd6','#d98324','#c0507a','#0f6b8a','#b5651d','#3b6d11'];
  function syncRoles13(){
    if(!S)return false;
    const all=[];
    const push=r=>{const v=String(r==null?'':r).trim();if(v&&all.indexOf(v)<0)all.push(v)};
    (S.roles||[]).forEach(push);ROLES.slice().forEach(push);
    (S.people||[]).forEach(p=>push(p.role));
    let ch=false;
    all.forEach((r,i)=>{
      if(!ROLEHEX[r]){ROLEHEX[r]=PAL13[i%PAL13.length];ch=true}
      if(!ROLEC[r]){ROLEC[r]='var(--r'+(i%5+1)+')';ch=true}
    });
    if(all.length!==ROLES.length||all.some((r,i)=>ROLES[i]!==r)){ROLES.length=0;all.forEach(r=>ROLES.push(r));ch=true}
    if(ch)S.roles=all.slice();
    return ch;
  }

  const _r13=render;
  render=function(){
    let changed=dropDemo();
    if(syncRoles13())changed=true;
    if(changed)try{save()}catch(e){}
    _r13();
    if(S&&S.ui&&S.ui.view==='client')try{patchClientCards()}catch(e){}
  };

  window.__V13_READY__=true;
})();

/* ===== V14 · R1：业务成为一级对象（补启动段） =====
   之前「项目」是从任务的项目名字符串自动长出来的影子，不能新建、不能立项。
   这一轮把它升成可新建、可归档的业务实体，并把「启动段」三件套（目标／为什么接／决策）落到字段上。
*/
(()=>{
  const P=()=>Array.isArray(S&&S.projects)?S.projects:[];
  const bizOf=nm=>P().find(p=>String(p.name||'').trim()===String(nm||'').trim())||null;
  const V=id=>{const e=document.getElementById(id);return e?String(e.value||'').trim():''};
  const st=document.createElement('style');
  st.textContent='body.ro [data-act="biznew"],body.ro [data-act="bizedit"],body.ro [data-act="bizsave"],body.ro [data-act="bizdel"]{display:none!important}';
  document.head.appendChild(st);

  function ensureBiz(){
    if(!S)return false;
    if(!Array.isArray(S.projects)){S.projects=[];return true}
    let ch=false;
    S.projects.forEach(p=>{
      if(p.kind===undefined){p.kind='once';ch=true}
      if(p.kind!=='standing'&&p.kind!=='once'){p.kind='once';ch=true}
      if(p.stage===undefined){p.stage='S1';ch=true}
      if(p.goal===undefined){p.goal='';ch=true}
      if(p.why===undefined){p.why='';ch=true}
      if(p.decision===undefined){p.decision='';ch=true}
      if(!Array.isArray(p.milestones)){p.milestones=[];ch=true}
      if(p.planOk===undefined){p.planOk=false;ch=true}
      if(p.budget===undefined){p.budget='';ch=true}
      if(!p.review||typeof p.review!=='object'){p.review={at:'',did:'',gap:'',why:'',next:''};ch=true}
      if(!Array.isArray(p.reviews)){p.reviews=[];ch=true}
      if(p.closedAt===undefined){p.closedAt='';ch=true}
      if(p.clientId===undefined){p.clientId='';ch=true}
    });
    return ch;
  }
  function bizMiss(p){
    const m=[];
    if(!p||!p.goal)m.push('目标一句话');
    if(!p||!p.why)m.push('为什么接');
    if(!p||!p.decision)m.push('接不接的决策');
    if(!p||!p.clientId)m.push('委托方');
    return m;
  }

  function bizForm(nm){
    const isNew=!nm;
    const p=isNew?{name:'',kind:'once',goal:'',why:'',decision:'',budget:'',clientId:''}:(bizOf(nm)||{name:nm,kind:'once'});
    const opts=(S.ext||[]).map(c=>`<option value="${c.id}" ${c.id===p.clientId?'selected':''}>${esc(c.name)}</option>`).join('');
    const body=`<div class="form">
      <div class="full"><label class="fl">业务名称 *</label><input class="fld" id="b_name" value="${esc(p.name||'')}" ${isNew?'':'disabled'} placeholder="例：智慧水务平台建设"></div>
      <div><label class="fl">委托方（谁给的活）</label><select class="fld" id="b_client"><option value="">未指定</option>${opts}</select></div>
      <div><label class="fl">类型</label><select class="fld" id="b_kind">
        <option value="once" ${p.kind!=='standing'?'selected':''}>一次性项目（有结项）</option>
        <option value="standing" ${p.kind==='standing'?'selected':''}>常设运维（没有终点，按周期复盘）</option></select></div>
      <div class="full"><label class="fl">目标 · 做成什么样算成 *</label><input class="fld" id="b_goal" value="${esc(p.goal||'')}" placeholder="例：年底前完成管网漏损治理验收并回款"></div>
      <div class="full"><label class="fl">为什么接 · 背景依据 *</label><textarea class="fld" id="b_why" placeholder="谁提的、依据什么文件、有什么前置条件">${esc(p.why||'')}</textarea></div>
      <div><label class="fl">决策</label><select class="fld" id="b_dec">
        <option value="">还没定</option>
        <option value="接" ${p.decision==='接'?'selected':''}>接</option>
        <option value="观察" ${p.decision==='观察'?'selected':''}>观察（先摸底不投入）</option>
        <option value="不接" ${p.decision==='不接'?'selected':''}>不接</option></select></div>
      <div><label class="fl">预算 / 口径</label><input class="fld" id="b_budget" value="${esc(p.budget||'')}" placeholder="例：专项债 730 万，财评口径待定"></div>
    </div>`;
    const foot=`${isNew?'':'<button class="btn dgr" data-act="bizdel" data-p="'+esc(p.name)+'">删除业务</button>'}<span style="flex:1"></span><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="bizsave" data-p="${isNew?'':esc(p.name)}">${isNew?'建立业务':'保存'}</button>`;
    modal(isNew?'新建业务 · 启动段':'业务档案 · '+p.name,body,foot,true);
  }
  function bizSave(old){
    const nm=V('b_name');
    if(!nm){toast('业务名称不能为空');return}
    let p=old?bizOf(old):P().find(x=>x.name===nm);
    if(!p){
      if(P().some(x=>x.name===nm)){toast('已有同名业务');return}
      p={id:uid(),name:nm,created:TODAY,stage:'S1',milestones:[],planOk:false,
         review:{at:'',did:'',gap:'',why:'',next:''},reviews:[],closedAt:'',clientId:''};
      S.projects.push(p);
    }
    p.clientId=V('b_client');
    p.kind=V('b_kind')==='standing'?'standing':'once';
    p.goal=V('b_goal');p.why=V('b_why');p.decision=V('b_dec');p.budget=V('b_budget');
    save();closeModal();render();
    const m=bizMiss(p);
    toast(m.length?('已保存。立项还差：'+m.join('、')):'已立项，可以进「计划」段了');
  }
  function bizDel(nm){
    const p=bizOf(nm);if(!p)return;
    const n=(S.tasks||[]).filter(t=>t.projectId===p.id||String(t.project||'').trim()===p.name).length;
    const msg=n?('这个业务下还有 '+n+' 项任务。删除业务不会删任务，任务会变成「未归项目」。确定删除？'):('确定删除业务「'+nm+'」？');
    if(!confirm(msg))return;
    S.projects=P().filter(x=>x.id!==p.id);
    (S.tasks||[]).forEach(t=>{if(t.projectId===p.id)t.projectId=''});
    save();closeModal();render();toast('业务已删除');
  }

  /* 项目页：加「新建业务」按钮 + 每张卡标立项状态 + 业务档案入口 */
  function decorateProject(){
    const ha=document.querySelector('#view .head-actions');
    if(ha&&!ha.querySelector('[data-act="biznew"]'))
      ha.insertAdjacentHTML('afterbegin','<button class="btn pri" data-act="biznew">＋ 新建业务</button>');
    document.querySelectorAll('#view .proj[data-p]').forEach(el=>{
      if(el.dataset.bizDone)return;el.dataset.bizDone='1';
      const nm=el.dataset.p,p=bizOf(nm),m=bizMiss(p);
      const kind=p&&p.kind==='standing'?'常设运维':'一次性项目';
      const line=m.length
        ?`<div class="ps" style="color:#b56a00;font-weight:600">待立项：还差 ${esc(m.join('、'))}</div>`
        :`<div class="ps" style="color:#12a06a">已立项 · ${kind}${p.decision==='观察'?' · 观察中':''}${p.closedAt?' · 已结项':''}</div>`;
      const pn=el.querySelector('.pn');
      if(pn)pn.insertAdjacentHTML('beforebegin',line);
      const btn=el.querySelector('[data-act="projclient"]');
      if(btn)btn.insertAdjacentHTML('afterend','<button class="btn sm" data-act="bizedit" data-p="'+esc(nm)+'" style="margin-left:5px">业务档案</button>');
    });
  }

  /* 派单表单的「所属项目」候选，要包含还没派过活的新业务 */
  const _tf14=taskForm;
  taskForm=function(t){
    _tf14(t);
    const dl=document.getElementById('projlist');
    if(!dl)return;
    const have=new Set([].slice.call(dl.querySelectorAll('option')).map(o=>o.value));
    const extra=P().map(p=>p.name).filter(n=>n&&!have.has(n));
    if(extra.length)dl.insertAdjacentHTML('beforeend',extra.map(n=>'<option value="'+esc(n)+'">').join(''));
  };

  document.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
    const a=el.dataset.act;
    if(a!=='biznew'&&a!=='bizedit'&&a!=='bizsave'&&a!=='bizdel')return;
    e.preventDefault();e.stopPropagation();
    if(a==='biznew')bizForm('');
    else if(a==='bizedit')bizForm(el.dataset.p);
    else if(a==='bizsave')bizSave(el.dataset.p||'');
    else bizDel(el.dataset.p);
  },true);

  const _r14=render;
  render=function(){
    let ch=ensureBiz();
    if(ch)try{save()}catch(e){}
    _r14();
    if(S&&S.ui&&S.ui.view==='project'){
      /* ensureProjects 可能刚按任务名长出新的业务，这里补一次字段，别让它带着 undefined 进下一轮 */
      if(ensureBiz())try{save()}catch(e){}
      try{decorateProject()}catch(e){}
    }
  };

  window.__V14_READY__=true;
})();

/* ===== V14 · R2：五段状态机 + 门禁 + 五段看板 =====
   项目页从「卡片墙」改成五段看板：启动／计划／执行／监督／总结。
   监督不是要走过去的阶段，是并行告警列——有逾期或卡点就出现在这里，允许与左边重复。
   每段有门禁：不满足就拦，并说清差哪几项。
*/
(()=>{
  const P=()=>Array.isArray(S&&S.projects)?S.projects:[];
  const TS=()=>(S&&S.tasks?S.tasks:[]);
  const NP=p=>Object.assign({kind:'once',stage:'S1',milestones:[],planOk:false,review:{}},p);
  const bizOf=nm=>P().find(p=>String(p.name||'').trim()===String(nm||'').trim())||null;
  const tasksOf=p=>TS().filter(t=>t.projectId===p.id||String(t.project||'').trim()===p.name);
  const isLate2=t=>t.status!=='已完成'&&!!t.due&&t.due<TODAY;
  const isBlk2=t=>t.status!=='已完成'&&!!t.flow;
  const STG={S1:'启动',S2:'计划',S3:'执行',S5:'总结'};
  const SORDER=['S1','S2','S3','S5'];
  const SHEX2={S1:'#7a5cd6',S2:'#2563d9',S3:'#0f9b96',S4:'#d9870b',S5:'#12a06a'};

  const sty=document.createElement('style');
  sty.textContent=`
  .bkan{display:grid;grid-template-columns:repeat(5,minmax(206px,1fr));gap:11px;overflow-x:auto;padding-bottom:9px}
  .bkan .kcol{min-height:230px}
  .bkan .kcol.s4{background:#fdf6ec;border-color:#efdcc0}
  .bkan .bcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.15s}
  .bkan .bcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
  .bkan .bt{font-weight:600;font-size:13px;line-height:1.45;margin-bottom:3px}
  .bkan .bsub{font-size:11.5px;color:var(--muted);line-height:1.65}
  .bkan .bnum{display:flex;gap:10px;font-size:11px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
  .bkan .bnum b{font-size:13px;margin-right:1px}
  .bkan .bact{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .bkan .bact .btn{padding:2px 8px;font-size:11px}
  body.ro .bkan .bact{display:none}
  `;
  document.head.appendChild(sty);

  function nextStage(s){return s==='S1'?'S2':s==='S2'?'S3':s==='S3'?'S5':''}
  function prevStage(s){const i=SORDER.indexOf(s);return i>0?SORDER[i-1]:''}
  function gateMiss(p){
    const ts=tasksOf(p),m=[];
    if(p.stage==='S1'){
      if(!p.goal)m.push('目标一句话');
      if(!p.why)m.push('为什么接');
      if(!p.decision)m.push('接不接的决策');
      if(!p.clientId)m.push('委托方');
      return m;
    }
    if(p.stage==='S2'){
      if(!(p.milestones||[]).some(x=>x&&x.due))m.push('1 个带日期的里程碑');
      if(!(Number(p.deliverTarget)>0||ts.some(t=>t.deliverable)))m.push('1 个交付物');
      if(!p.planOk)m.push('计划评审通过（勾选）');
      return m;
    }
    if(p.stage==='S3'){
      const open=ts.filter(t=>t.status!=='已完成').length;
      if(open)m.push('还有 '+open+' 项任务没完成');
      if(ts.some(t=>t.deliverable&&!t.receipt))m.push('回执 / 验收单未到手');
      return m;
    }
    return [];
  }
  function logBiz(p,txt){if(!Array.isArray(p.log))p.log=[];p.log.push({at:TODAY,text:txt})}

  /* 里程碑维护：计划段的门禁要有入口，否则过不去 */
  function msForm(nm){
    const p0=bizOf(nm);if(!p0)return;
    const rows=(p0.milestones||[]).map((m,i)=>`<div style="display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)">
      <input type="checkbox" data-act="mstog" data-p="${esc(nm)}" data-i="${i}" ${m.done?'checked':''} style="min-height:auto">
      <span style="flex:1;font-size:12.5px;${m.done?'color:var(--muted);text-decoration:line-through':''}">${esc(m.name||'')}</span>
      <span style="font-size:11.5px;color:${m.due&&m.due<TODAY&&!m.done?'var(--danger)':'var(--muted)'}">${esc(m.due||'未设日期')}</span>
      <button class="btn sm" data-act="msdel" data-p="${esc(nm)}" data-i="${i}" style="padding:1px 7px;font-size:11px">×</button></div>`).join('')
      ||'<div class="empty" style="font-size:12px;padding:8px 0;text-align:left">还没有里程碑。计划段至少要有一条带日期的里程碑，才能推进到「执行」。</div>';
    modal('里程碑 · '+nm,
      `<div style="font-size:12px;color:var(--muted);margin-bottom:9px;line-height:1.75">里程碑是计划段的骨架：<b>什么时候交什么</b>。至少一条带日期的里程碑＋一条交付物＋勾上「计划评审通过」，才能进执行段。</div>${rows}
       <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
         <input class="fld" id="ms_name" placeholder="例：财评报告定稿" style="flex:1;min-width:150px">
         <input class="fld" type="date" id="ms_due" value="${TODAY}" style="width:145px">
         <button class="btn pri" data-act="msadd2" data-p="${esc(nm)}">＋ 加一条</button></div>`,
      '<button class="btn pri" data-act="close">完成</button>',true);
  }
  function msAdd(nm){
    const p0=bizOf(nm);if(!p0)return;
    const n=(document.getElementById('ms_name')||{}).value||'';
    const d=(document.getElementById('ms_due')||{}).value||'';
    if(!String(n).trim()){toast('先写里程碑名称');return}
    if(!Array.isArray(p0.milestones))p0.milestones=[];
    p0.milestones.push({id:uid(),name:String(n).trim(),due:d,done:false});
    logBiz(p0,'加里程碑：'+String(n).trim()+(d?'（'+d+'）':''));
    save();msForm(nm);render();
  }
  function msToggle(nm,i,on){
    const p0=bizOf(nm);if(!p0||!p0.milestones||!p0.milestones[i])return;
    p0.milestones[i].done=!!on;
    logBiz(p0,(on?'完成':'重开')+'里程碑：'+(p0.milestones[i].name||''));
    save();render();
  }
  function msDel(nm,i){
    const p0=bizOf(nm);if(!p0||!p0.milestones)return;
    const m=p0.milestones[i];if(!m)return;
    p0.milestones.splice(i,1);logBiz(p0,'删里程碑：'+(m.name||''));
    save();msForm(nm);render();
  }

  function advBiz(nm){
    const p0=bizOf(nm);if(!p0)return;
    const p=NP(p0),to=nextStage(p.stage);
    if(!to){toast('已经是最后一段了');return}
    const miss=gateMiss(p);
    if(miss.length){toast('还差 '+miss.length+' 项才能进「'+STG[to]+'」：'+miss.slice(0,3).join('、')+(miss.length>3?' 等':''));return}
    p0.stage=to;logBiz(p0,'推进 '+STG[p.stage]+' → '+STG[to]);
    if(to==='S5'&&p0.kind!=='standing'&&!p0.closedAt)p0.closedAt='';
    save();render();toast('已进入「'+STG[to]+'」段');
  }
  function backBiz(nm){
    const p0=bizOf(nm);if(!p0)return;
    const p=NP(p0),to=prevStage(p.stage);
    if(!to){toast('已经在第一段');return}
    p0.stage=to;logBiz(p0,'退回 '+STG[p.stage]+' → '+STG[to]);
    save();render();toast('已退回「'+STG[to]+'」段（有留痕）');
  }
  function openBiz(nm){
    const p=bizOf(nm);if(!p){toast('业务还没建立，先补档案');return}
    if(typeof clientDrawer==='function'){/* noop */}
    bizDossier(nm);
  }
  function bizDossier(nm){
    const p=NP(bizOf(nm)||{name:nm});
    const ts=tasksOf(p);
    const done=ts.filter(t=>t.status==='已完成').length;
    const lt=ts.filter(isLate2).length,bl=ts.filter(isBlk2).length;
    const cli=p.clientId?((S.ext||[]).find(c=>c.id===p.clientId)||{}).name:'';
    const flowRows=SORDER.map((s,i)=>{
      const cur=p.stage===s,passed=SORDER.indexOf(p.stage)>i;
      return `<div style="display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)">
        <span class="chip" style="color:${SHEX2[s]};border-color:${SHEX2[s]};${cur?'background:'+SHEX2[s]+'14;font-weight:700':''}">${STG[s]}</span>
        <div style="flex:1;font-size:12px;color:var(--muted);line-height:1.7">
          ${s==='S1'?'目标 / 为什么接 / 决策 / 委托方':s==='S2'?'里程碑 / 交付物 / 计划评审':s==='S3'?'任务推进 / 一线反馈 / 卡点归口':'交付回执 / 复盘四问 / 结项归档'}
        </div>
        <span style="font-size:11.5px;${cur?'color:'+SHEX2[s]+';font-weight:700':passed?'color:#12a06a':'color:var(--muted)'}">${cur?'当前':passed?'已过':'未到'}</span>
      </div>`;
    }).join('');
    const miss=p.stage==='S5'?[]:gateMiss(p);
    const ms=(p.milestones||[]).map(m=>`<div style="display:flex;gap:8px;font-size:12px;padding:3px 0">
      <span style="color:${m.done?'#12a06a':'var(--muted)'}">${m.done?'✓':'○'}</span><span style="flex:1">${esc(m.name||'')}</span>
      <span style="color:${m.due&&m.due<TODAY&&!m.done?'var(--danger)':'var(--muted)'}">${esc(m.due||'未设日期')}</span></div>`).join('')||'<div class="empty" style="padding:6px 0;font-size:12px">还没有里程碑</div>';
    document.getElementById('drawerRoot').innerHTML=`<div class="drawer-mask" data-act="closedrawer"></div><div class="drawer">
      <div class="dh"><div class="avatar" style="background:${SHEX2[p.stage]||'#2563d9'}">${esc(String(p.name||'?').slice(0,1))}</div>
        <div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:700">${esc(p.name)}</div>
        <div style="font-size:12px;color:var(--muted)">${p.kind==='standing'?'常设运维':'一次性项目'}${cli?' · '+esc(cli):' · 未标委托方'}${p.decision?' · 决策：'+esc(p.decision):''}</div></div>
        <button class="x" data-act="closedrawer">×</button></div>
      <div class="db">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center">
          ${[['任务',ts.length],['完成',done],['逾期',lt],['卡点',bl]].map(([a,b])=>`<div class="panel" style="padding:8px 3px"><div style="font-size:17px;font-weight:700;${(a==='逾期'||a==='卡点')&&b?'color:var(--danger)':''}">${b}</div><div style="font-size:10px;color:var(--muted)">${a}</div></div>`).join('')}</div>
        <div class="sec-t">五段进度</div>${flowRows}
        ${miss.length?`<div style="margin-top:9px;background:#fff8ec;border-left:3px solid #d9870b;border-radius:0 8px 8px 0;padding:8px 11px;font-size:12px;line-height:1.7">
          <b>进「${STG[nextStage(p.stage)]||'—'}」还差：</b>${esc(miss.join('、'))}</div>`:''}
        <div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap">
          <button class="btn sm" data-act="bizedit" data-p="${esc(p.name)}">业务档案</button>
          ${p.kind!=='standing'&&nextStage(p.stage)&&!miss.length?`<button class="btn sm pri" data-act="bizadv" data-p="${esc(p.name)}">进「${STG[nextStage(p.stage)]}」</button>`:''}
          ${p.stage==='S5'&&p.kind!=='standing'?`<button class="btn sm pri" data-act="bizreview" data-p="${esc(p.name)}">复盘并结项</button>`:''}
          ${p.kind==='standing'?`<button class="btn sm" data-act="bizreview" data-p="${esc(p.name)}">本期复盘</button>`:''}
        </div>
        <div class="sec-t">目标</div><div style="font-size:12.5px;line-height:1.75">${esc(p.goal||'—')}</div>
        <div class="sec-t">里程碑（${(p.milestones||[]).length}）　<button class="btn sm" data-act="msadd" data-p="${esc(p.name)}" style="padding:1px 8px;font-size:11px">维护</button></div>${ms}
        ${p.kind==='standing'
          ?`<div class="sec-t">本期复盘（${thisMonth()}）</div>${(()=>{const r=(p.reviews||[]).find(x=>x.period===thisMonth());return r?`<div style="font-size:12px;line-height:1.75">${esc(r.did||'')}</div>`:'<div style="font-size:12px;color:#b56a00">这个月还没复盘</div>'})()}
             <div style="font-size:11.5px;color:var(--muted);margin-top:4px">累计复盘 ${(p.reviews||[]).length} 期</div>`
          :(p.stage==='S5'
            ?`<div class="sec-t">复盘${p.closedAt?'（已结项 '+esc(p.closedAt)+'）':''}</div>
               ${rDone(p.review)?`<div style="font-size:12px;line-height:1.8">
                 <b>做成了：</b>${esc(p.review.did)}<br><b>差在哪：</b>${esc(p.review.gap)}<br>
                 <b>为什么：</b>${esc(p.review.why)}<br><b>下次：</b>${esc(p.review.next)}</div>`
               :`<div style="font-size:12px;color:#b56a00">还没复盘。四问填完才能结项归档。</div>`}
               ${!p.closedAt&&rDone(p.review)?`<div style="margin-top:7px"><button class="btn sm pri" data-act="bizclose" data-p="${esc(p.name)}">结项归档</button></div>`:''}`
            :'')}
        <div class="sec-t">任务（${ts.length}）</div>
        ${ts.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).map(t=>{
          const di=dueInfo(t.due,t.status),pr=person(t.personId);
          return `<div class="mini-task" data-act="task" data-id="${t.id}"><div class="mt">${esc(t.title)}</div>
            <div class="mm"><span class="chip">${esc(t.status)}</span><span class="due ${di.cls}">${di.txt}</span>${esc(pr.name)}${t.flow?'<span class="chip orange">卡'+esc(t.flow)+'</span>':''}</div></div>`;
        }).join('')||'<div class="empty">这个业务下还没有任务</div>'}
      </div></div>`;
  }

  function bizCard(p,cols){
    const ts=tasksOf(p);
    const done=ts.filter(t=>t.status==='已完成').length;
    const lt=ts.filter(isLate2).length,bl=ts.filter(isBlk2).length;
    const cli=p.clientId?((S.ext||[]).find(c=>c.id===p.clientId)||{}).name:'';
    const miss=p.stage==='S5'?[]:gateMiss(p),nxt=nextStage(p.stage);
    return `<div class="bcard" data-act="bizopen" data-p="${esc(p.name)}">
      <div class="bt">${esc(p.name)}</div>
      <div class="bsub">${cli?esc(cli):'<span style="color:#b56a00">未标委托方</span>'}${p.kind==='standing'?' · 常设运维':''}</div>
      ${miss.length?`<div class="bsub" style="color:#b56a00">还差：${esc(miss.slice(0,3).join('、'))}${miss.length>3?' 等':''}</div>`:''}
      <div class="bnum"><span><b>${ts.length}</b>任务</span><span><b style="color:${done?'#12a06a':'var(--muted)'}">${done}</b>完成</span>${lt?`<span style="color:var(--danger)"><b>${lt}</b>逾期</span>`:''}${bl?`<span style="color:#b56a00"><b>${bl}</b>卡点</span>`:''}</div>
      ${p.stage==='S2'?`<label style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2);margin-top:6px"><input type="checkbox" data-act="bizplan" data-p="${esc(p.name)}" ${p.planOk?'checked':''} style="min-height:auto">计划评审通过</label>`:''}
      <div class="bact">
        ${nxt&&!miss.length?`<button class="btn sm pri" data-act="bizadv" data-p="${esc(p.name)}">进${STG[nxt]}</button>`:''}
        ${p.stage!=='S1'?`<button class="btn sm" data-act="bizback" data-p="${esc(p.name)}">退回</button>`:''}
        <button class="btn sm" data-act="bizedit" data-p="${esc(p.name)}">档案</button>
      </div></div>`;
  }

  vProject=function(){
    const names=[...new Set([...P().map(p=>p.name),...TS().map(t=>String(t.project||'').trim()).filter(Boolean)])];
    const bizs=names.map(nm=>NP(bizOf(nm)||{id:'',name:nm}));
    const groups={S1:[],S2:[],S3:[],S5:[],S4:[]};
    bizs.forEach(p=>{
      const s=SORDER.indexOf(p.stage)>=0?p.stage:'S1';
      groups[s].push(p);
      const al=tasksOf(p).filter(t=>isLate2(t)||isBlk2(t));
      if(al.length)groups.S4.push(p);
    });
    const noProj=TS().filter(t=>!String(t.project||'').trim());
    const banner=noProj.length
      ?`<div class="panel" style="margin-bottom:12px;border-color:#efdcc0;background:#fffaf1;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b style="color:#b56a00">未归项目 ${noProj.length} 项</b>
        <span style="font-size:12px;color:var(--ink2);flex:1;min-width:190px">这些任务还没写「所属项目」，所以上不了业务卡。补个项目名就归位。</span>
        <button class="btn sm" data-act="projnone">逐条补项目</button></div>`
      :'';
    const cols=[['S1','启动','该不该干'],['S2','计划','怎么干'],['S3','执行','推着干'],['S4','监督','盯着卡点'],['S5','总结','留下经验']]
      .map(([s,nm,note])=>{
        const list=groups[s]||[];
        const body=s==='S4'
          ? (list.length?list.map(p=>bizCard(p)).join(''):'<div class="empty" style="padding:14px 4px;font-size:12px">没有告警业务，干净</div>')
          : (list.length?list.map(p=>bizCard(p)).join(''):`<div class="empty" style="padding:14px 4px;font-size:12px">暂无</div>`);
        return `<div class="kcol ${s==='S4'?'s4':''}" data-stage="${s}">
          <div class="kh"><div class="n"><i style="background:${SHEX2[s]}"></i>${nm}</div><span class="c">${list.length}</span></div>
          <div style="font-size:10.5px;color:var(--muted);margin:-4px 3px 8px">${note}${s==='S4'?'（并行，会和左边重复出现）':''}</div>
          ${body}</div>`;
      }).join('');
    return head('业务五段','启动定该不该干、计划定怎么干、执行推着干、监督盯着卡点、总结留下经验；点卡片看业务档案',
      '<button class="btn pri" data-act="biznew">＋ 新建业务</button>')
      + banner
      + `<div class="bkan">${cols}</div>`
      + (bizs.length?'':'<div class="empty" style="margin-top:14px">还没有业务。点右上角「＋ 新建业务」先把第一件要干的事立起来；或者建任务时写个「所属项目」，也会在这里长出一张待立项的业务卡。</div>');
  };

  document.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
    const a=el.dataset.act;
    if(a!=='bizadv'&&a!=='bizback'&&a!=='bizopen'&&a!=='msadd'&&a!=='msadd2'&&a!=='msdel'
       &&a!=='bizreview'&&a!=='bizclose'&&a!=='rvsave'&&a!=='rvclose')return;
    e.preventDefault();e.stopPropagation();
    if(a==='bizadv')advBiz(el.dataset.p);
    else if(a==='bizback')backBiz(el.dataset.p);
    else if(a==='bizopen')bizDossier(el.dataset.p);
    else if(a==='msadd')msForm(el.dataset.p);
    else if(a==='msadd2')msAdd(el.dataset.p);
    else if(a==='msdel')msDel(el.dataset.p,Number(el.dataset.i));
    else if(a==='bizreview')reviewForm(el.dataset.p);
    else if(a==='bizclose')bizClose(el.dataset.p);
    else if(a==='rvsave')rvSave(el.dataset.p,false);
    else rvSave(el.dataset.p,true);
  },true);

  document.addEventListener('change',e=>{
    const el=e.target;if(!el||!el.dataset||!el.dataset.act)return;
    if(el.dataset.act==='mstog'){msToggle(el.dataset.p,Number(el.dataset.i),el.checked);return}
    if(el.dataset.act!=='bizplan')return;
    const p0=bizOf(el.dataset.p);if(!p0)return;
    p0.planOk=!!el.checked;logBiz(p0,'计划评审 '+(el.checked?'通过':'取消'));
    save();render();
  },true);

  /* ---------- R3：总结段（复盘四问 / 结项 / 常设周期复盘 / 简报两节） ---------- */
  const thisMonth=()=>String(TODAY).slice(0,7);
  const rDone=r=>!!(r&&r.did&&r.gap&&r.why&&r.next);
  function reviewForm(nm){
    const p0=bizOf(nm);if(!p0)return;
    const stand=p0.kind==='standing';
    const cur=stand?((p0.reviews||[]).find(r=>r.period===thisMonth())||{}):(p0.review||{});
    modal((stand?'本期复盘 · ':'复盘与结项 · ')+nm,
      `<div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.75">
        ${stand?'常设运维没有终点，不结项，按月复盘一次，累积成运维台账。':'四问填完才能结项归档。结项后业务留在「总结」列留档，不再计入在办。'}</div>
       <div class="form">
        <div class="full"><label class="fl">① 做成了什么（结果 / 数据）*</label><textarea class="fld" id="rv_did" placeholder="例：完成 12 个子系统验收，回款 305 万">${esc(cur.did||'')}</textarea></div>
        <div class="full"><label class="fl">② 差在哪（偏差 / 没做到的）*</label><textarea class="fld" id="rv_gap" placeholder="例：物联网部分延后 20 天，软件占比被财评压了 8%">${esc(cur.gap||'')}</textarea></div>
        <div class="full"><label class="fl">③ 为什么（原因，别只写客观原因）*</label><textarea class="fld" id="rv_why" placeholder="例：启动段没拿到财评口径，报价按旧口径做了">${esc(cur.why||'')}</textarea></div>
        <div class="full"><label class="fl">④ 下次怎么做（可复用做法）*</label><textarea class="fld" id="rv_next" placeholder="例：涉财评项目在启动段就要书面确认口径，再动报价">${esc(cur.next||'')}</textarea></div>
       </div>`,
      `<span style="flex:1"></span><button class="btn" data-act="close">取消</button>`+
      (stand?`<button class="btn pri" data-act="rvsave" data-p="${esc(nm)}">保存本期复盘</button>`
            :`<button class="btn" data-act="rvsave" data-p="${esc(nm)}">只保存复盘</button><button class="btn pri" data-act="rvclose" data-p="${esc(nm)}">保存并结项</button>`),true);
  }
  function rvSave(nm,doClose){
    const p0=bizOf(nm);if(!p0)return;
    const g=id=>{const e=document.getElementById(id);return e?String(e.value||'').trim():''};
    const r={did:g('rv_did'),gap:g('rv_gap'),why:g('rv_why'),next:g('rv_next')};
    if(p0.kind==='standing'){
      if(!r.did){toast('第①问「做成了什么」得写，其余可简写');return}
      if(!Array.isArray(p0.reviews))p0.reviews=[];
      const i=p0.reviews.findIndex(x=>x.period===thisMonth());
      const rec=Object.assign({period:thisMonth(),at:TODAY},r);
      if(i>=0)p0.reviews[i]=rec;else p0.reviews.push(rec);
      logBiz(p0,'本期复盘（'+thisMonth()+'）');
      save();closeModal();render();toast('本期复盘已存档');
      return;
    }
    p0.review=Object.assign({at:TODAY},r);
    if(doClose){
      if(!rDone(p0.review)){toast('四问要全部填完才能结项');save();return}
      p0.closedAt=TODAY;
      if(SORDER.indexOf(p0.stage)<SORDER.indexOf('S5'))p0.stage='S5';
      logBiz(p0,'复盘完成并结项');
      save();closeModal();render();toast('已结项，经验已留档');
      return;
    }
    logBiz(p0,'复盘四问已保存');
    save();closeModal();render();toast('复盘已保存（还没结项）');
  }
  function bizClose(nm){
    const p0=bizOf(nm);if(!p0)return;
    if(!rDone(p0.review)){toast('四问没填完，不能结项');return}
    p0.closedAt=TODAY;logBiz(p0,'结项归档');
    save();render();toast('已结项归档');
  }

  /* 完成率要把常设运维剔出去——运维没有终点，混进去完成率永远上不去 */
  const _stats3=stats;
  stats=function(){
    const s=_stats3();
    const names=new Set(P().filter(p=>p.kind==='standing').map(p=>p.name));
    if(!names.size){s.realTotal=s.total;s.realDone=s.done;s.standN=0;return s}
    const st=TS().filter(t=>names.has(String(t.project||'').trim()));
    s.standN=st.length;
    s.realTotal=Math.max(0,s.total-st.length);
    s.realDone=Math.max(0,s.done-st.filter(t=>t.status==='已完成').length);
    s.rate=s.realTotal?Math.round(s.realDone/s.realTotal*100):0;
    return s;
  };
  kpis=function(){
    const s=stats(),D='#dc3f3f';
    const rt=s.realTotal===undefined?s.total:s.realTotal;
    const rd=s.realDone===undefined?s.done:s.realDone;
    const a=[['直管人员',s.people,'共 '+ROLES.length+' 类角色','var(--brand)'],
      ['市公司协调',s.orgs,'协调支撑归口','#c0507a'],
      ['今日到期',s.today,'需今日收口','#d9870b'],
      ['进行中',s.doing,'正在推进','#2563d9'],
      ['逾期 / 卡协调',s.late+' / '+s.blocked,'逾期数 / 等协调数',D],
      ['整体完成率',s.rate+'%','已完成 '+rd+' / '+rt+' 项'+(s.standN?'（不含运维 '+s.standN+' 项）':''),'#12a06a']];
    return `<div class="kpis">${a.map(([l,n,f,c])=>`<div class="kpi" style="--c:${c}"><div class="lb">${l}</div><div class="num" ${c===D&&s.late?'style="color:var(--danger)"':''}>${n}</div><div class="foot">${f}</div></div>`).join('')}</div>`;
  };

  /* 简报补两节：该立项了 / 该复盘了 —— 制度只有在这里才每天被看见 */
  const _bt3=briefText;
  briefText=function(){
    const base=_bt3();
    const L=[];
    /* 刚按任务名长出来的业务可能还没写 stage，一律按「启动段」算 */
    const stg=p=>SORDER.indexOf(p.stage)>=0?p.stage:'S1';
    const kick=P().filter(p=>stg(p)==='S1'&&(!p.goal||!p.decision));
    if(kick.length){
      L.push('附三、该立项了（'+kick.length+' 项 · 停在启动段）');
      kick.slice(0,8).forEach((p,i)=>{
        const miss=[!p.goal?'目标':'',!p.decision?'决策':'',!p.clientId?'委托方':'',!p.why?'为什么接':''].filter(Boolean).join('、');
        L.push('  '+(i+1)+'. '+p.name+'｜缺：'+miss);
      });
      L.push('');
    }
    const rv=P().filter(p=>p.kind!=='standing'&&stg(p)==='S5'&&!p.closedAt);
    const mo=P().filter(p=>p.kind==='standing'&&!((p.reviews||[]).some(r=>r.period===thisMonth())));
    if(rv.length||mo.length){
      L.push('附四、该复盘了（'+(rv.length+mo.length)+' 项）');
      rv.forEach((p,i)=>L.push('  '+(i+1)+'. '+p.name+'｜交付完成，待复盘结项'));
      mo.forEach((p,i)=>L.push('  '+(rv.length+i+1)+'. '+p.name+'｜常设运维，'+thisMonth()+' 未复盘'));
      L.push('');
    }
    return L.length?base+'\n\n'+L.join('\n'):base;
  };

  /* ---------- R4：任务段标 + 段分布 + 图表段位分布 ---------- */
  const TST=[['S1','启动','#7a5cd6'],['S2','计划','#2563d9'],['S3','执行','#0f9b96'],['S4','监督','#d9870b'],['S5','总结','#12a06a']];
  const tstOf=t=>{const k=t&&t.stage;return TST.some(x=>x[0]===k)?k:'S3'};
  const tstN=k=>(TST.find(x=>x[0]===k)||TST[2])[1];

  /* 任务表单补一个「属于哪一段」，默认执行段，日常小活不用管 */
  const _tf4=taskForm;
  taskForm=function(t){
    _tf4(t);
    const box=document.querySelector('#modalRoot .modal .form');
    if(!box||document.getElementById('f_stage'))return;
    const cur=tstOf(t);
    box.insertAdjacentHTML('beforeend',`<div><label class="fl">这条活属于哪一段</label>
      <select class="fld" id="f_stage">${TST.map(([k,n])=>`<option value="${k}" ${k===cur?'selected':''}>${n}段</option>`).join('')}</select></div>`);
  };
  /* 原保存逻辑不认识这个字段，保存完补写一次（第二次 save 只是落盘，无副作用） */
  document.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest('[data-act="savetask2"]');
    if(!el)return;
    const sel=document.getElementById('f_stage');
    if(!sel)return;
    const val=sel.value,id=el.dataset.id||'';
    setTimeout(()=>{
      try{
        const t=id?TS().find(x=>x.id===id):TS()[0];
        if(!t)return;
        if(tstOf(t)!==val){t.stage=val;save();render()}
      }catch(err){}
    },0);
  },true);

  /* 任务卡片上标出它属于哪一段 */
  const _tc4=taskCard;
  taskCard=function(t){
    let h=_tc4(t);
    const s=TST.find(x=>x[0]===tstOf(t))||TST[2];
    const chip=`<span class="chip" style="border-color:${s[2]};color:${s[2]}">${s[1]}段</span>`;
    return h.indexOf('<div class="tm">')>=0?h.replace('<div class="tm">','<div class="tm">'+chip):h;
  };

  /* 业务档案底部：任务按段分布，指出哪一段一条活都没有 */
  const _bd4=bizDossier;
  bizDossier=function(nm){
    _bd4(nm);
    try{
      const p=NP(bizOf(nm)||{name:nm});
      const ts=tasksOf(p);
      if(!ts.length)return;
      const rows=TST.map(([k,n,c])=>({k,n,c,v:ts.filter(t=>tstOf(t)===k).length}));
      const empty=rows.filter(x=>!x.v);
      const db=document.querySelector('#drawerRoot .db');
      if(!db||db.querySelector('[data-tdist]'))return;
      db.insertAdjacentHTML('beforeend',`<div data-tdist="1"><div class="sec-t">任务按段分布</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${rows.map(x=>`<span class="chip" style="border-color:${x.c};color:${x.c}">${x.n} ${x.v}</span>`).join('')}</div>

    }catch(e){}

  /* 图表页补一张：手里的业务停在哪一段 */
  const _vc4=window.vChart;
  window.vChart=function(){

      const bizs=P();
      if(!bizs.length)return h;

      const max=Math.max(1,...rows.map(r=>r.v));

  const VER=3, SNAP_K='zq_wb_snap_v3';
  function defShape(){

      wbSync:{at:'',count:0,err:'',source:'',regress:0},

      ui:{view:'room',f:{},pq:''}};

  function sanitize(){

    if(!S||typeof S!=='object'||Array.isArray(S)){S=defShape();return {fixed:['整份数据不可用，已重建为空结构']}}
    ['people','orgs','tasks','ext','projects'].forEach(k=>{
      if(!Array.isArray(S[k])){S[k]=[];fixed.push(k+' 不是数组，已重置为空')}
    });
    if(!S.meta||typeof S.meta!=='object'){S.meta=defShape().meta;fixed.push('meta 缺失，已补默认值')}
    if(!S.ui||typeof S.ui!=='object'){S.ui=defShape().ui;fixed.push('界面状态缺失，已补')}

    if(!Array.isArray(S.wbInbox))S.wbInbox=[];
    if(!S.wbSync||typeof S.wbSync!=='object')S.wbSync=defShape().wbSync;

      if(!Array.isArray(t.gates))t.gates=[];
      if(t.client===undefined)t.client='';
      if(t.personId&&!pids.has(t.personId)){t.personId='';orphan++}
    });

    S.projects.forEach(p=>{
      if(p.clientId&&!((S.ext||[]).some(c=>c.id===p.clientId))){p.clientId='';fixed.push('业务：'+p.name+' 的委托方已删除，已清空')}

  function snapshots(){try{return JSON.parse(localStorage.getItem(SNAP_K)||'[]')||[]}catch(e){return []}}

  function restoreSnap(i){

      <div class="sec-t">本地快照（自动留最近 5 份）</div>
      ${snaps.length?snaps.map((s,i)=>`<div style="display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)">
          <span style="flex:1">${esc(s.stamp)}　<span style="color:var(--muted)">${esc(s.reason||'')}</span></span>
          <span style="color:var(--muted);font-size:11px">${bytes(s.data)} KB</span>
          <button class="btn sm" data-act="snaprestore" data-i="${i}">回滚</button></div>`).join('')

      <div style="margin-top:9px"><button class="btn sm" data-act="snapnow">＋ 现在存一份快照</button>
        <span style="font-size:11.5px;color:var(--muted);margin-left:6px">导入脏数据不会白屏，体检会逐条修并记在「上次体检」里</span></div>`);
  };

  let __healthOnce=false;

        const r=sanitize();

        try{save()}catch(e){}
        if(r.fixed.length)setTimeout(()=>toast('数据体检修复了 '+r.fixed.length+' 处，详见「数据管理」'),500);
      }
      if(S&&!__healthOnce){__healthOnce=true;pushSnap('打开页面自动留档')}
    }catch(e){}

  document.addEventListener('click',e=>{

    const a=el.dataset.act;
    if(a==='snapnow'){e.preventDefault();e.stopPropagation();pushSnap('手动存档');dataModal();toast('已存一份快照');}
    else if(a==='snaprestore'){e.preventDefault();e.stopPropagation();restoreSnap(Number(el.dataset.i));}
  },true);

  window.__V15_READY__=true;
})();

/* ===== R7（2026-11-08）：全局搜索覆盖业务/客户/段位/复盘 + 键盘可走完 + 快捷键一览 ===== */
(function(){
  const SNM={S1:'启动',S2:'计划',S3:'执行',S4:'监督',S5:'总结'};
  const KIND={'视图':0,'业务':1,'客户':2,'人员':3,'任务':4,'段位':5,'复盘':6};
  let sel=0,cur=[];

  const st=document.createElement('style');
  st.textContent=`
  .cmdrow.on{background:var(--brand-soft);color:var(--brand)}

  .mseg-flash{outline:2px solid var(--brand);outline-offset:-2px;border-radius:11px}
  #modalRoot .mb .btn.sm[data-act="help"]{margin-left:6px}`;
  document.head.appendChild(st);

  /* 借用已有 data-act 处理器：造一个按钮点一下，行为与界面上完全一致（含门禁与留痕） */
  function fire(act,ds){
    const b=document.createElement('button');
    b.setAttribute('data-act',act);
    Object.keys(ds||{}).forEach(k=>{b.dataset[k]=ds[k]});
    b.style.display='none';
    document.body.appendChild(b);
    b.click();
    b.remove();
  }
  const projs=()=>(S&&Array.isArray(S.projects))?S.projects:[];
  const stageOf=p=>p&&SNM[p.stage]?p.stage:'S1';
  function needReview(p){
    if(!p||p.closedAt)return false;
    if(stageOf(p)==='S5')return true;
    if(p.kind==='standing'){
      const m=String(TODAY).slice(0,7);
      return !(p.reviews||[]).some(r=>String(r.period||r.at||'').slice(0,7)===m);
    }
    return false;
  }
  const score=(hay,q,exact)=>{hay=String(hay||'').toLowerCase();if(!q)return 3;if(hay===q)return 0;if(hay.indexOf(q)===0)return 1;return hay.indexOf(q)>=0?2:-1};

  function rows(q){
    const out=[];
    const add=(k,t,s,act,v,sc)=>out.push({k,t,s,act,v,sc:(sc===undefined?2:sc)});
    /* 视图 */
    VIEWS.forEach(([k,v])=>{const sc=score(v,q,false);if(sc>=0)add('视图',v,'切到「'+v+'」','view',k,sc)});
    /* 业务（点开就是业务档案，和卡片上那个按钮同一条路） */
    projs().forEach(p=>{
      const nm=String(p.name||'');
      const hay=nm+' '+String(p.goal||'')+' '+String(p.why||'');
      const sc=score(nm,q,false)>=0?score(nm,q,false):score(hay,q,false);
      if(sc>=0)add('业务',nm,SNM[stageOf(p)]+'段 · '+(p.kind==='standing'?'常设运维':'一次性'),'biz',nm,sc);
    });
    /* 客户 */
    (S.ext||[]).forEach(c=>{
      const nm=String(c.name||'');
      const hay=nm+' '+String(c.type||'')+' '+String(c.contact||'')+' '+String(c.title||'');
      const sc=score(nm,q,false)>=0?score(nm,q,false):score(hay,q,false);
      if(sc>=0)add('客户',nm,(c.type||'')+(c.contact?' · '+c.contact:''),'client',c.id,sc);
    });
    /* 人员 */
    (S.people||[]).forEach(p=>{
      const hay=p.name+' '+(p.org||'')+' '+(p.role||'');
      const sc=score(hay,q,false);if(sc<0)return;
      const open=(S.tasks||[]).filter(t=>t.personId===p.id&&t.status!=='已完成').length;
      add('人员',p.name,(p.role||'')+' · 在办 '+open+' 项','person',p.id,sc);
    });
    /* 任务 */
    (S.tasks||[]).forEach(t=>{
      const pn=(typeof person==='function')?person(t.personId).name:'';
      const hay=t.title+' '+(t.project||'')+' '+(t.note||'')+' '+pn+' '+(t.deliverable||'');
      const sc=score(hay,q,false);if(sc<0)return;
      add('任务',t.title,(t.status||'')+(t.project?' · '+t.project:''),'task',t.id,sc+1);
    });
    /* 段位直达 */
    Object.keys(SNM).forEach(k=>{
      if(k==='S4')return;
      const nm=SNM[k];

(function(){
  const SK='zq_wb_snap_v3';
  const BUDGET=2200000;      /* 快照区字符预算：实测本机 localStorage 约 5.2M 字符，留足本体空间 */
  const CAP=5;

  /* 原逻辑是「先 unshift 再整包写」，配额一爆整包就写不进去，最新的反而丢了。
     这里改成「按预算从最旧的开始砍，砍到写得进去为止」，保证最新的那几份一定落地。 */
  const _set=Storage.prototype.setItem;
  Storage.prototype.setItem=function(k,v){
    if(k!==SK)return _set.call(this,k,v);
    let payload=v;
    try{
      const arr=JSON.parse(v);
      if(Array.isArray(arr)&&arr.length){
        let keep=arr.slice(0,CAP);
        let json=JSON.stringify(keep);
        while(keep.length>1&&json.length>BUDGET){
          keep=keep.slice(0,keep.length-1);
          json=JSON.stringify(keep);
        }
        if(json.length>BUDGET)json=JSON.stringify([arr[0]]);
        payload=json;
      }
    }catch(e){}
    try{ return _set.call(this,k,payload) }
    catch(e){
      /* 整包写不进去：先腾出旧快照的位置，只写最新一份；还写不进就把旧的原样放回去 */
      let prev=null;
      try{ prev=this.getItem(k) }catch(x){}
      try{ this.removeItem(k) }catch(x){}
      try{ return _set.call(this,k,JSON.stringify([JSON.parse(v)[0]])) }
      catch(e2){
        if(prev!==null&&prev!==undefined){ try{ _set.call(this,k,prev) }catch(e3){} }
        else{ try{ this.removeItem(k) }catch(e4){} }
        throw e;
      }
    }
  };

  const kb=n=>Math.round(n/1024*10)/10;
  function usage(){
    let n=0;
    try{ for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=String(k).length+String(localStorage.getItem(k)||'').length} }catch(e){}
    return n;
  }
  function snapInfo(){
    let list=[],len=0;
    try{const raw=localStorage.getItem(SK)||'[]';list=JSON.parse(raw)||[];len=raw.length}catch(e){}
    return {n:list.length,kb:kb(len),b:len};
  }

  dataModal=function(){
    _dm9();

    if(!mb)return;
    const u=usage(),si=snapInfo();
    let body=0;
    try{body=(localStorage.getItem('zq_workbench_v2')||'').length}catch(e){}
    const LIMIT=5200000;
    const pct=Math.min(100,Math.round(u/LIMIT*100));
    const col=pct>85?'#c62f2f':pct>65?'#b56a00':'#12a06a';
    mb.insertAdjacentHTML('beforeend',`
      <div class="sec-t">存储与配额</div>
      <div style="font-size:12px;line-height:1.9;color:var(--ink2)">
        数据本体 ${kb(body)} KB　·　快照 ${si.n} 份 / ${si.kb} KB（预算 ${kb(BUDGET)} KB）
        <div style="margin:7px 0 4px;height:7px;background:var(--panel2);border-radius:5px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${col}"></div></div>
        <div style="font-size:11.5px;color:var(--muted)">本机已用 ${kb(u)} KB / 约 ${kb(LIMIT)} KB（${pct}%）　·　快照按「最新的先保」留，写不下时自动丢最旧的</div>
      </div>
      <div style="margin-top:8px"><button class="btn sm" data-act="snapclear">清空快照（留出空间）</button>
        <span style="font-size:11.5px;color:var(--muted);margin-left:6px">清空前先导出一份 JSON 更稳妥</span></div>`);
  };

    const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
    if(el.dataset.act==='snapclear'){
      e.preventDefault();e.stopPropagation();

      try{localStorage.removeItem(SK)}catch(x){}

  window.__R14__={lateDays,lateAll,postForm,postSave,urge,listModal};
})();
/* ===== R15（2026-11-08）：批量操作 —— 多选任务，一次改状态/改人/改期限/删除，可撤销 ===== */
(function(){

  .r15bar.on{border-color:var(--brand);background:var(--brand-soft)}

  function bar(){

      b=document.createElement('div');b.className='r15bar';
      kan.insertAdjacentElement('beforebegin',b);
    }
    const live=TS().filter(t=>sel.has(t.id)).length;
    [...sel].forEach(id=>{if(!TS().some(t=>t.id===id))sel.delete(id)});
    b.classList.toggle('on',mode);
    b.innerHTML=`<button class="btn sm ${mode?'pri':''}" data-act="r15mode">${mode?'退出多选':'☐ 多选'}</button>
      ${mode?`<span class="n">已选 <b>${live}</b> 项</span>
        <button class="btn sm" data-act="r15all">全选当前</button>
        <button class="btn sm" data-act="r15none">清空</button>
        <span style="flex:1"></span>
        <button class="btn sm pri" data-act="r15go" ${live?'':'disabled'}>批量处理</button>`
      :`<span class="n">勾上先多选，再一次性改状态 / 改人 / 改期限</span>`}
      ${undo?`<button class="btn sm" data-act="r15undo">撤销上次批量（${undo.items.length} 项）</button>`:''}`;
    return b;
  }

  function paintCards(){
    const view=document.getElementById('view');if(!view)return;
    document.body.classList.toggle('r15pick',mode);
    view.querySelectorAll('.tcard').forEach(card=>{
      const id=card.dataset.id;
      const on=sel.has(id);
      card.classList.toggle('picked',mode&&on);
      let ck=card.querySelector('.r15ck');
      if(!mode){if(ck)ck.remove();card.draggable=true;card.style.paddingRight='';return}
      card.draggable=false;
      card.style.paddingRight='30px';
      if(!ck){
        ck=document.createElement('input');ck.type='checkbox';ck.className='r15ck';ck.dataset.id=id;
        card.appendChild(ck);
      }
      ck.checked=on;
    });
  }

  function applyModal(){
    const ids=[...sel].filter(id=>TS().some(t=>t.id===id));
    if(!ids.length){toast('先勾几条任务');return}
    const popts=S.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
    modal('批量处理 · '+ids.length+' 项',
      `<div class="form">
        <div><label class="fl">改成状态</label><select class="fld" id="r15_st">
          <option value="">不变</option>${STATUS.map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div><label class="fl">改成负责人</label><select class="fld" id="r15_ps">

        <div><label class="fl">改成期限</label><input class="fld" type="date" id="r15_due"></div>
        <div class="full"><div style="font-size:11.5px;color:var(--muted);line-height:1.75">
          三项都留空就等于没改。改完会写进每条任务的日志，并给一个「撤销上次批量」的后悔键。</div></div>
        <div class="full" style="padding-top:4px"><div class="sec-t">要改的任务</div>
          ${ids.slice(0,10).map(id=>{const t=TS().find(x=>x.id===id);
            return `<div style="font-size:12px;padding:2px 0;color:var(--ink2)">· ${esc(t.title)}</div>`}).join('')}
          ${ids.length>10?`<div style="font-size:11.5px;color:var(--muted)">… 还有 ${ids.length-10} 项</div>`:''}</div>

      '<button class="btn dgr" data-act="r15del">删除这些</button><span style="flex:1"></span>'+
      '<button class="btn" data-act="close">取消</button><button class="btn pri" data-act="r15save">应用</button>',true);
  }

  function snap(){
    const ids=[...sel];
    return {at:Date.now(),items:ids.map(id=>{
      const t=TS().find(x=>x.id===id);return t?{id,status:t.status,personId:t.personId,due:t.due,logLen:(t.log||[]).length}:null;
    }).filter(Boolean)};
  }
  function applySave(){
    const stv=(document.getElementById('r15_st')||{}).value||'';

    const due=(document.getElementById('r15_due')||{}).value||'';
    if(!stv&&!pid&&!due){toast('三项都没选，没东西可改');return}
    undo=snap();

      if(pid&&t.personId!==pid){bits.push('负责人 '+person(t.personId).name+'→'+person(pid).name);t.personId=pid}
      if(due&&t.due!==due){bits.push('期限 '+(t.due||'未设')+'→'+due);t.due=due}
      if(bits.length){t.updated=TODAY;t.log.push({at:TODAY,text:'批量改：'+bits.join('；')});n++}
    });
    sel.clear();mode=false;
    save();closeModal();render();toast('批量改了 '+n+' 项，可以撤销');
  }
  function applyDel(){
    const ids=[...sel];
    if(!ids.length)return;
    if(!confirm('删除选中的 '+ids.length+' 条任务？删完可以用「撤销上次批量」找回来。'))return;
    undo={at:Date.now(),items:ids.map(id=>{
      const i=TS().findIndex(x=>x.id===id);return i<0?null:{id,idx:i,obj:JSON.parse(JSON.stringify(TS()[i]))};
    }).filter(Boolean)};
    S.tasks=S.tasks.filter(t=>!ids.includes(t.id));
    sel.clear();mode=false;
    save();closeModal();render();toast('已删除 '+ids.length+' 项，可以撤销');
  }
  function doUndo(){
    if(!undo||!undo.items.length){toast('没有可撤销的批量');return}
    let n=0;
    undo.items.forEach(it=>{
      if(it.obj){/* 删除撤销：放回原位置 */
        if(TS().some(t=>t.id===it.obj.id))return;
        const arr=S.tasks||[];arr.splice(Math.min(it.idx,arr.length),0,it.obj);S.tasks=arr;n++;return;
      }
      const t=TS().find(x=>x.id===it.id);if(!t)return;
      t.status=it.status;t.personId=it.personId;t.due=it.due;
      if(Array.isArray(t.log)&&t.log.length>it.logLen)t.log.length=it.logLen;
      n++;
    });
    undo=null;
    save();render();toast('已撤销 '+n+' 项');
  }

  const _r=render;render=function(){
    if(!S||!S.ui||S.ui.view!=='board'){mode=false;sel.clear();document.body.classList.remove('r15pick')}
    _r();
    try{bar();paintCards()}catch(e){}
  };

  document.addEventListener('click',e=>{
    const tgt=e.target;
    /* 多选状态下点卡片＝勾选，不打开任务 */
    const card=tgt.closest&&tgt.closest('.tcard');
    if(mode&&card){
      e.preventDefault();e.stopPropagation();
      const id=card.dataset.id;
      if(sel.has(id))sel.delete(id);else sel.add(id);
      render();return;
    }
    const ck=tgt.closest&&tgt.closest('.r15ck');
    if(ck){
      e.preventDefault();e.stopPropagation();
      const id=ck.dataset.id;
      if(sel.has(id))sel.delete(id);else sel.add(id);
      render();return;
    }
    const el=tgt.closest&&tgt.closest('[data-act]');if(!el)return;
    const a=el.dataset.act;
    if(a==='r15mode'){e.preventDefault();e.stopPropagation();mode=!mode;if(!mode)sel.clear();render()}
    else if(a==='r15all'){
      e.preventDefault();e.stopPropagation();
      const view=document.getElementById('view');
      view.querySelectorAll('.tcard').forEach(c=>sel.add(c.dataset.id));
      render();
    }
    else if(a==='r15none'){e.preventDefault();e.stopPropagation();sel.clear();render()}
    else if(a==='r15go'){e.preventDefault();e.stopPropagation();applyModal()}
    else if(a==='r15save'){e.preventDefault();e.stopPropagation();applySave()}
    else if(a==='r15del'){e.preventDefault();e.stopPropagation();applyDel()}
    else if(a==='r15undo'){e.preventDefault();e.stopPropagation();doUndo()}
  },true);

  window.__R15__={sel:()=>[...sel],mode:()=>mode,undo:()=>undo};
})();

/* ===== R17（2026-11-08）：数据体检 —— 把脏数据一次挑出来，逐条能跳过去改 ===== */
(function(){
  const TS=()=>Array.isArray(S&&S.tasks)?S.tasks:[];
  const PS=()=>Array.isArray(S&&S.projects)?S.projects:[];
  const CS=()=>Array.isArray(S&&S.ext)?S.ext:[];
  const PPL=()=>Array.isArray(S&&S.people)?S.people:[];
  const nm=id=>{const p=PPL().find(x=>x.id===id);return p?p.name:''};

  const st=document.createElement('style');

  .hbadge{display:inline-block;min-width:15px;height:15px;line-height:15px;border-radius:8px;background:var(--danger);
    color:#fff;font-size:9.5px;text-align:center;padding:0 3px;margin-left:3px;vertical-align:2px}
  .r17g{margin-bottom:10px}
  .r17g .gh{font-size:11.5px;color:var(--muted);margin-bottom:3px;letter-spacing:.4px}

  .r17row .its{flex-basis:100%;display:flex;gap:5px;flex-wrap:wrap;padding-left:14px}
  .r17row .its span{font-size:11px;color:var(--brand);cursor:pointer;border-bottom:1px dashed currentColor}
  .r17ok{padding:14px;text-align:center;color:#12a06a;font-size:13px}`;
  document.head.appendChild(st);

  function scan(){
    const out=[];
    const add=(grp,lv,txt,items)=>{if(items&&items.length)out.push({grp,lv,txt,items})};
    const tk=(t,lab)=>({label:lab||t.title.slice(0,16),act:'task',ds:{id:t.id}});
    const bk=(p,lab)=>({label:lab||p.name,act:'bizopen',ds:{p:p.name}});
    const ck=(c,lab)=>({label:lab||c.name,act:'clientview',ds:{id:c.id}});

    /* 任务 */
    const noOwner=TS().filter(t=>!PPL().some(p=>p.id===t.personId));
    add('任务','red','负责人已不在团队名单里（这些任务没人认领）',noOwner.map(t=>tk(t)));
    const noProj=TS().filter(t=>!String(t.project||'').trim());
    add('任务','amber','没写所属项目，上不了业务卡',noProj.map(t=>tk(t)));
    const badDate=TS().filter(t=>t.due&&t.created&&t.due<t.created);
    add('任务','amber','期限早于建立日期（日期填反了）',badDate.map(t=>tk(t)));

    add('任务','amber','在办但没设期限，逾期预警抓不到它',noDue.map(t=>tk(t)));
